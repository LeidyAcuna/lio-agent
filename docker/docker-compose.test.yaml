services:
  lio-agent-python_test:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: lio-agent-app-python_test
    restart: always
    volumes:
      - ../src:/app/src
      - /app/.venv
    ports:
      - "5679:5679"
    environment:
      - DEBUG_MODE=false
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PW=${POSTGRES_PW}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - TOKEN_TELEGRAM_LIO=${TOKEN_TELEGRAM_LIO}
      - MAX_CONCURRENCY=${MAX_CONCURRENCY}
      - OLLAMA_URL=${OLLAMA_URL}
      - ALLOWED_TELEGRAM_USER_IDS=${ALLOWED_TELEGRAM_USER_IDS}
    depends_on:
      postgres_test:
        condition: service_healthy
      ollama:
        condition: service_healthy
    env_file:
      - ../tests/.env.test
    networks:
      - lio_agent_net

  postgres_test:
    image: postgres:18.1
    container_name: lio_agent_postgres_db_test
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PW}
      - PGPORT=${POSTGRES_PORT}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - lio_postgres_data_test:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - lio_agent_net

  ollama:
    image: ollama/ollama:0.17.7
    container_name: ollama
    volumes:
      - lio_ollama_data:/root/.ollama
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 5
    ports:
      - "11434:11434"
    networks:
      - lio_agent_net
    # GPU NVIDIA
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

    # Contenedor auxiliar para descargar el modelo
  ollama-pull-model:
    image: curlimages/curl:8.18.0
    container_name: ollama-pull-model
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: [ "curl", "-X", "POST", "http://ollama:11434/api/pull", "-d", '{"name": "llama3.1"}' ]
    networks:
      - lio_agent_net

volumes:
  lio_ollama_data:
    external: true
  lio_postgres_data_test:
    external: true

networks:
  lio_agent_net:
    external: true
