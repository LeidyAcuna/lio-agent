services:
  lio-agent-python_prod:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: lio-agent-app-python_prod
    restart: always
    ports:
      - "5677:5677"
    environment:
      - DEBUG_MODE=false
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PW=${POSTGRES_PW}
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - TOKEN_TELEGRAM_LIO=${TOKEN_TELEGRAM_LIO}
      - MAX_CONCURRENCY=${MAX_CONCURRENCY}
      - OLLAMA_URL=${OLLAMA_URL}
      - ALLOWED_TELEGRAM_USER_IDS=${ALLOWED_TELEGRAM_USER_IDS}
    depends_on:
      postgres_prod:
        condition: service_healthy
    env_file:
      - ../.env.prod
    networks:
      - lio_agent_net

  postgres_prod:
    image: postgres:18.1
    container_name: prod_lio_agent_postgres_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_PASSWORD=${POSTGRES_PW}
      - PGPORT=${POSTGRES_PORT}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - lio_postgres_data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      start_period: 10s
      retries: 5
    networks:
      - lio_agent_net

volumes:
  lio_postgres_data:
    external: true

networks:
  lio_agent_net:
    external: true
