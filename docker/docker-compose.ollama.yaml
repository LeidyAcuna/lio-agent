services:
  ollama:
    image: ollama/ollama:0.17.7
    container_name: ollama
    restart: unless-stopped
    volumes:
      - lio_ollama_data:/root/.ollama
    healthcheck:
      test: [ "CMD", "ollama", "list" ]
      interval: 10s
      timeout: 10s
      start_period: 20s
      retries: 5
    ports:
      - "11434:11434"
    networks:
      - lio_agent_net
    # GPU NVIDIA
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

    # Contenedor auxiliar para descargar el modelo
  ollama-pull-model:
    image: curlimages/curl:8.18.0
    container_name: ollama-pull-model
    depends_on:
      ollama:
        condition: service_healthy
    entrypoint: [ "curl", "-X", "POST", "http://ollama:11434/api/pull", "-d", '{"name": "llama3.1"}' ]
    networks:
      - lio_agent_net

volumes:
  lio_ollama_data:
    external: true

networks:
  lio_agent_net:
    external: true
