[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
env_override_existing_values = 1
env_files =
    tests/.env.test

# Log to file
log_file = tests/logs/test_run.log
log_file_level = INFO
log_file_format = %(asctime)s [%(levelname)s] %(name)s: %(message)s
log_file_date_format = %Y-%m-%d %H:%M:%S
